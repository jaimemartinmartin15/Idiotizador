name: Build And Deploy
run-name: Deploy Idiotizador to AWS S3

on:
  workflow_dispatch: # allow manual trigger
  push:
    tags: ['[1-9].[0-9][0-9]?.[0-9][0-9]?']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install
        run: npm install @angular/cli @jaimemartinmartin15/jei-devkit-angular-builders@5.2.1 html-minifier-terser --save-dev
      - name: Build
        run: |
          mkdir -p dist
          npx html-minifier-terser index.html -o dist/index.html --collapse-whitespace --remove-comments --minify-css true --minify-js true
          cp -r favicons dist/favicons/
      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          mask-aws-account-id: true
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-2
      - name: Deploy
        run: ng deploy --dry-run=false
